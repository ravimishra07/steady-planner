<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syllabus · interactive canvas</title>
  <link rel="stylesheet" href="canvas-shell.css">
  <style>
    .canvas-main .canvas { min-width: 1000px; min-height: 1000px; }
    .screen-col { height: 920px !important; }
  </style>
</head>
<body class="canvas-shell">
  <header class="bar">
    <div>
      <h1>07 · Syllabus — interactive</h1>
      <p>
        <a href="canvas-view.html">← Main canvas</a>
        &middot;
        <a href="syllabus.html" target="_blank">Open full screen</a>
      </p>
    </div>
    <span class="hint">design/syllabus-canvas-view.html</span>
  </header>

  <div class="workspace">
    <aside class="screen-nav" id="screen-nav">
      <div class="nav-head">Screens</div>
      <div class="nav-list"></div>
      <div class="nav-foot">Click to scroll</div>
    </aside>

    <main class="canvas-main" id="canvas-main">
      <div class="canvas" id="canvas"></div>
    </main>
  </div>

  <script type="module">
    import { mountScreenNav } from './canvas-nav.js';

    const boards = [
      { id: 'screen-0', num: 7, t: 'Syllabus · dark',  theme: '',    x: 0,   y: 40 },
      { id: 'screen-1', num: 7, t: 'Syllabus · light', theme: 'light', x: 470, y: 40 },
    ];

    const root = document.getElementById('canvas');
    const navItems = boards.map((b) => ({
      id: b.id,
      num: b.num,
      label: b.t,
      sub: b.theme === 'light' ? 'Light theme' : 'Dark theme',
    }));

    boards.forEach((b) => {
      const col = document.createElement('div');
      col.className = 'screen-col';
      col.id = b.id;
      col.style.left = b.x + 'px';
      col.style.width = '390px';

      const wrap = document.createElement('div');
      wrap.className = 'artboard mobile' + (b.theme === 'light' ? ' light' : '');
      wrap.style.position = 'absolute';
      wrap.style.left = '0';
      wrap.style.top = b.y + 'px';

      const cap = document.createElement('div');
      cap.className = 'label';
      cap.textContent = b.t;

      const iframe = document.createElement('iframe');
      iframe.className = 'frame';
      iframe.src = 'syllabus.html' + (b.theme ? '?theme=' + b.theme : '');
      iframe.title = b.t;
      iframe.style.width = '390px';
      iframe.style.height = '844px';

      wrap.appendChild(cap);
      wrap.appendChild(iframe);
      col.appendChild(wrap);
      root.appendChild(col);
    });

    mountScreenNav(document.getElementById('screen-nav'), navItems, {
      scrollRoot: document.getElementById('canvas-main'),
    });
  </script>
</body>
</html>
