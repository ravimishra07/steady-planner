<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .onboard-body h1{margin-bottom:var(--sam-space-lg)}
    .sam-ios .opt{min-height:64px;align-items:center}
    .sam-ios .opt .hrs{display:flex;gap:6px;margin-top:8px}
    .sam-ios .opt .hrs span{font-size:var(--sam-fs-xs);font-weight:600;padding:3px 8px;border-radius:var(--sam-r-sm);background:var(--sam-elevated);color:var(--sam-text-secondary);font-variant-numeric:tabular-nums}
    .sam-ios .opt.sel .hrs span{background:var(--sam-brand-container);color:var(--sam-brand-deep)}
    .sam-ios .list{gap:var(--sam-space-sm)}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="onboard-bar">
    <button class="glass-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <span class="bar-sp" aria-hidden="true"></span>
  </div>
  <div class="onboard-body">
    <h1>Your schedule</h1>
    <div class="list">
      <button class="opt">
        <span>
          <b>Full-time</b>
          <span class="hrs"><span>8h weekday</span><span>8h weekend</span></span>
        </span>
        <span class="tick"></span>
      </button>
      <button class="opt">
        <span>
          <b>Working</b>
          <span class="hrs"><span>3h weekday</span><span>8h weekend</span></span>
        </span>
        <span class="tick"></span>
      </button>
      <button class="opt sel">
        <span>
          <b>College</b>
          <span class="hrs"><span>4h weekday</span><span>7h weekend</span></span>
        </span>
        <span class="tick"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </div>
  <div class="foot">
    <button class="cta">Continue</button>
  </div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
