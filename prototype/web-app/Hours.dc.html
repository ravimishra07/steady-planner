<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .onboard-body h1{margin-bottom:var(--sam-space-lg)}
    .sam-ios .stack{display:flex;flex-direction:column;gap:var(--sam-space-md)}
    .sam-ios .slide .knob{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--sam-brand);border:3px solid var(--sam-bg);transform:translate(-50%,-50%)}
    .sam-ios .slide .track-line{position:relative}
    .sam-ios .slide .ticks{display:flex;justify-content:space-between;margin-top:11px;font-size:var(--sam-fs-xs);color:var(--sam-text-muted);font-variant-numeric:tabular-nums}
    .sam-ios .total{display:flex;align-items:center;gap:14px;background:var(--sam-brand-container);border-radius:var(--sam-r-md);padding:16px 18px}
    .sam-ios .total b{font-size:var(--sam-fs-xxl);font-weight:700;color:var(--sam-brand-deep);font-variant-numeric:tabular-nums;line-height:1}
    .sam-ios .total span{font-size:var(--sam-fs-sub);color:var(--sam-text-secondary);line-height:1.45}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="onboard-bar">
    <button class="glass-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <span class="bar-sp" aria-hidden="true"></span>
  </div>
  <div class="onboard-body">
    <h1>Hours per day</h1>
    <div class="stack">
      <div class="slide">
        <div class="top"><b>Weekdays</b><i>4 hrs</i></div>
        <div class="track-line"><i style="width:27%"></i><span class="knob" style="left:27%"></span></div>
        <div class="ticks"><span>1h</span><span>7h</span><span>14h</span></div>
      </div>
      <div class="slide">
        <div class="top"><b>Weekends</b><i>7 hrs</i></div>
        <div class="track-line"><i style="width:44%"></i><span class="knob" style="left:44%"></span></div>
        <div class="ticks"><span>1h</span><span>8h</span><span>16h</span></div>
      </div>
      <div class="total">
        <b>568</b>
        <span>hours total</span>
      </div>
      <div class="field">
        <label>Study spot</label>
        <div class="val">Terrace</div>
      </div>
    </div>
  </div>
  <div class="foot">
    <button class="cta">Build my plan</button>
  </div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
