<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .topbar .lbl{flex:1;font-size:var(--sam-fs-sm);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted)}
    .sam-ios .dialwrap{flex:none;display:flex;align-items:center;justify-content:center;position:relative;margin-top:var(--sam-space-lg)}
    .sam-ios .dialwrap svg{display:block}
    .sam-ios .dialtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .sam-ios .clock{font-size:var(--sam-fs-display);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
    .sam-ios .of{font-size:var(--sam-fs-sm);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted)}
    .sam-ios .beads{display:flex;gap:7px;justify-content:center;margin-top:var(--sam-space-lg)}
    .sam-ios .beads i{width:7px;height:7px;border-radius:50%;background:var(--sam-elevated)}
    .sam-ios .beads i.done{background:var(--sam-success)}
    .sam-ios .beads i.now{background:var(--sam-brand)}
    .sam-ios .taskcard{margin:var(--sam-space-xl) var(--sam-screen-h) 0;background:var(--sam-surface);border:var(--sam-card-border);border-radius:var(--sam-r-md);padding:16px 18px;box-shadow:var(--sam-card-shadow)}
    .sam-ios .taskcard .tag{display:inline-block;margin-bottom:10px}
    .sam-ios .taskcard b{display:block;font-size:var(--sam-fs-headline);font-weight:600;line-height:1.3;margin-bottom:5px}
    .sam-ios .taskcard p{font-size:var(--sam-fs-sub);color:var(--sam-text-muted);line-height:1.5}
    .sam-ios .blockcard{margin:var(--sam-space-md) var(--sam-screen-h) 0;background:var(--sam-surface-tinted);border:var(--sam-card-border);border-radius:var(--sam-r-md);padding:15px 18px}
    .sam-ios .blockcard .r{display:flex;align-items:center;gap:12px}
    .sam-ios .blockcard b{flex:1;font-size:var(--sam-fs-callout);font-weight:600}
    .sam-ios .sw{width:44px;height:26px;border-radius:13px;background:var(--sam-success);position:relative;flex:none}
    .sam-ios .sw i{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
    .sam-ios .apps{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .sam-ios .apps span{font-size:var(--sam-fs-xs);font-weight:500;background:var(--sam-elevated);color:var(--sam-text-secondary);padding:5px 10px;border-radius:var(--sam-r-sm)}
    .sam-ios .acts{margin-top:auto;display:flex;gap:10px;padding:var(--sam-space-xl) var(--sam-screen-h) var(--sam-space-md)}
    .sam-ios .stop{flex:1;min-height:54px;background:none;border:1px solid var(--sam-border);color:var(--sam-text);border-radius:var(--sam-r-pill);font-family:inherit;font-size:var(--sam-fs-lg);font-weight:600;cursor:pointer}
    .sam-ios .pause{width:54px;height:54px;flex:none;background:var(--sam-brand-deep);color:var(--sam-on-brand);border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="topbar">
    <span class="lbl">Focus &middot; running</span>
    <button class="glass-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>

  <div class="dialwrap">
    <svg width="236" height="236" viewBox="0 0 236 236" fill="none">
      <circle cx="118" cy="118" r="102" stroke="var(--sam-elevated)" stroke-width="10"/>
      <circle cx="118" cy="118" r="102" stroke="var(--sam-success)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="640.9" stroke-dashoffset="218"
              transform="rotate(-90 118 118)"/>
    </svg>
    <div class="dialtxt">
      <div class="clock">32:45</div>
      <div class="of">of 50 min</div>
    </div>
  </div>

  <div class="beads"><i class="done"></i><i class="done"></i><i class="now"></i><i></i></div>

  <div class="taskcard">
    <span class="tag prac">Practice</span>
    <b>Geometry &mdash; 40 questions</b>
    <p>Previous-year set, 2019&ndash;2023. Logged against this topic, not as loose minutes.</p>
  </div>

  <div class="blockcard">
    <div class="r"><b>4 apps blocked</b><span class="sw"><i></i></span></div>
    <div class="apps"><span>YouTube</span><span>Instagram</span><span>WhatsApp</span><span>Telegram</span></div>
  </div>

  <div class="acts">
    <button class="stop">Stop</button>
    <button class="pause" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.5" height="12" rx="1.2"/><rect x="11.5" y="4" width="3.5" height="12" rx="1.2"/></svg></button>
  </div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
