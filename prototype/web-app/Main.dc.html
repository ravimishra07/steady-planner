<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .onboard-body h1{margin-bottom:var(--sam-space-sm)}
    .sam-ios .verdict{display:flex;align-items:baseline;gap:12px;margin:0 0 var(--sam-space-md)}
    .sam-ios .verdict .n{font-size:var(--sam-fs-hero);font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--sam-danger);font-variant-numeric:tabular-nums}
    .sam-ios .verdict .u{font-size:var(--sam-fs-lg);font-weight:600;color:var(--sam-danger);line-height:1.2}
    .sam-ios .lede{font-size:var(--sam-fs-md);color:var(--sam-text-secondary);line-height:var(--sam-lh-relaxed);margin:calc(-1 * var(--sam-space-sm)) 0 var(--sam-space-lg)}
    .sam-ios .gauge{background:var(--sam-surface);border:var(--sam-card-border);border-radius:var(--sam-r-md);padding:16px 18px;box-shadow:var(--sam-card-shadow);margin-bottom:var(--sam-space-lg)}
    .sam-ios .gauge .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
    .sam-ios .gauge .cap .k{font-size:var(--sam-fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted)}
    .sam-ios .gauge .cap .v{font-size:var(--sam-fs-callout);font-weight:600;font-variant-numeric:tabular-nums}
    .sam-ios .gauge .cap .v em{font-style:normal;color:var(--sam-text-muted);font-weight:400}
    .sam-ios .gauge .bar{display:flex;height:46px;border-radius:var(--sam-r-sm);overflow:hidden}
    .sam-ios .gauge .have{background:var(--sam-brand-deep);display:flex;align-items:center;padding-left:12px}
    .sam-ios .gauge .have b{font-size:var(--sam-fs-sm);font-weight:600;color:var(--sam-on-brand);font-variant-numeric:tabular-nums}
    .sam-ios .gauge .miss{background:var(--sam-danger);display:flex;align-items:center;padding-left:10px}
    .sam-ios .gauge .miss b{font-size:var(--sam-fs-sm);font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
    .sam-ios .sec{font-size:var(--sam-fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted);margin-bottom:var(--sam-space-sm)}
    .sam-ios .fixcard{min-height:66px;align-items:flex-start;padding-top:14px;padding-bottom:14px}
    .sam-ios .fixcard .metric{color:var(--sam-brand-deep);font-weight:700}
    .sam-ios .list{gap:var(--sam-space-sm)}
    .sam-ios .onboard-bar .bar-flex{flex:1}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="onboard-bar">
    <button class="glass-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="bar-flex" aria-hidden="true"></span>
    <span class="bar-sp" aria-hidden="true"></span>
  </div>
  <div class="onboard-body">
    <h1>Your plan</h1>
    <p class="lede">70% of syllabus before 19 Dec.</p>
    <div class="verdict"><span class="n">244</span><span class="u">hours<br>short</span></div>

    <div class="gauge">
      <div class="cap"><span class="k">Hours</span><span class="v">568 <em>/ 812</em></span></div>
      <div class="bar">
        <span class="have" style="width:70%"><b>568h</b></span>
        <span class="miss" style="width:30%"><b>244h</b></span>
      </div>
    </div>

    <p class="sec">Close the gap</p>
    <div class="list">
      <button class="fixcard">
        <span class="metric">+2.1h</span>
        <span class="ftxt"><b>More hours daily</b><span>6.1h per day</span></span>
        <span class="chev">&#8250;</span>
      </button>
      <button class="fixcard">
        <span class="metric">&minus;18</span>
        <span class="ftxt"><b>Drop topics</b><span>Lowest-yield first</span></span>
        <span class="chev">&#8250;</span>
      </button>
      <button class="fixcard">
        <span class="metric">45d</span>
        <span class="ftxt"><b>Later date</b><span>If you can move it</span></span>
        <span class="chev">&#8250;</span>
      </button>
    </div>
  </div>
  <div class="foot"><button class="cta">Start day 1</button></div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
