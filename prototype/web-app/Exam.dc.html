<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .onboard-body h1{margin-bottom:var(--sam-space-sm)}
    .sam-ios .lede{font-size:var(--sam-fs-md);color:var(--sam-text-secondary);line-height:var(--sam-lh-relaxed);margin-bottom:var(--sam-space-xl)}
    .sam-ios .exam{min-height:68px;align-items:flex-start;padding-top:14px;padding-bottom:14px}
    .sam-ios .exam h3{margin-bottom:3px}
    .sam-ios .exam .meta{display:block;font-size:var(--sam-fs-sm);color:var(--sam-text-muted);line-height:1.4}
    .sam-ios .exam .load{display:flex;align-items:center;gap:8px;margin-top:9px}
    .sam-ios .exam .load .bar{width:56px;height:4px;border-radius:2px;background:var(--sam-elevated);overflow:hidden;flex:none}
    .sam-ios .exam .load .bar i{display:block;height:100%;background:var(--sam-brand-deep)}
    .sam-ios .exam .load em{font-style:normal;font-size:var(--sam-fs-xs);color:var(--sam-text-muted);font-variant-numeric:tabular-nums}
    .sam-ios .exam .tick{margin-top:2px}
    .sam-ios .list{gap:var(--sam-space-sm)}
    .sam-ios .foot .note{font-size:var(--sam-fs-sm);color:var(--sam-text-muted);text-align:center;margin-top:var(--sam-space-md);line-height:1.45}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="onboard-bar">
    <span class="bar-sp" aria-hidden="true"></span>
    <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <span class="bar-sp" aria-hidden="true"></span>
  </div>
  <div class="onboard-body">
    <p class="eyebrow">Step 1 of 4</p>
    <h1>Which exam?</h1>
    <p class="lede">Pick the one you are actually sitting. You can add a second later.</p>
    <div class="list">
      <button class="exam sel">
        <span>
          <h3>SSC CGL</h3>
          <span class="meta">28.1 lakh applied &middot; Tier 1 + Tier 2</span>
          <span class="load"><span class="bar"><i style="width:100%"></i></span><em>634 hrs &middot; 49 topics</em></span>
        </span>
        <span class="tick"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <button class="exam">
        <span><h3>SSC CHSL</h3><span class="meta">30 lakh applied &middot; Tier 1 + Tier 2</span></span>
        <span class="tick"></span>
      </button>
      <button class="exam">
        <span><h3>RRB NTPC</h3><span class="meta">1.22 crore applied &middot; CBT 1 + CBT 2</span></span>
        <span class="tick"></span>
      </button>
      <button class="exam">
        <span><h3>NEET UG</h3><span class="meta">22.8 lakh applied &middot; single paper</span></span>
        <span class="tick"></span>
      </button>
      <button class="exam">
        <span><h3>JEE Main</h3><span class="meta">15 lakh applied &middot; 2 sessions</span></span>
        <span class="tick"></span>
      </button>
      <button class="exam">
        <span><h3>IBPS PO</h3><span class="meta">12.4 lakh applied &middot; Prelims + Mains</span></span>
        <span class="tick"></span>
      </button>
    </div>
  </div>
  <div class="foot">
    <button class="cta">Continue</button>
    <p class="note">Only SSC CGL has a full syllabus tree so far.</p>
  </div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
