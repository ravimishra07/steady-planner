<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --ink:#16233A; --ink-2:#3D4C68; --ink-3:#7A87A0;
      --paper:#ECEFEA; --card:#FFFFFF; --line:#D6DBD4;
      --ochre:#B87514; --red:#C6362C; --green:#25664A; --green-soft:#DDEDE4;
      --on-dark:#9FAEC6; --dot-red:#FF8E82;
      --lift:0 1px 2px rgba(22,35,58,.05), 0 10px 24px -16px rgba(22,35,58,.20);
      --disp:"Bricolage Grotesque","Trebuchet MS",sans-serif;
      --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper)}
    a{color:var(--ochre);text-decoration:none}
    a:hover{color:#8F5A0F}
    .screen{width:393px;height:852px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}

    .hero{background:var(--ink);color:#fff;flex:none;padding:0 20px 18px}
    .safe{height:48px}
    .hrow{display:flex;justify-content:space-between;align-items:flex-end;padding-top:6px}
    .hrow h1{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.02em}
    .hrow .n{font-family:var(--mono);font-size:11px;color:var(--on-dark)}
    .obar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:14px;display:flex}
    .obar i{display:block;height:100%}
    .okeys{display:flex;gap:14px;margin-top:10px}
    .okeys div{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--on-dark)}
    .okeys i{width:8px;height:8px;border-radius:2px;flex:none}

    .scroll{flex:1;padding:14px 20px 0;overflow:hidden;position:relative}
    .fade{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(to top,var(--paper),rgba(236,239,234,0))}

    .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift);margin-bottom:9px;overflow:hidden}
    .sechead{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
    .ring{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
    .ring .in{width:24px;height:24px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--ink-2)}
    .snm{flex:1;min-width:0}
    .snm b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
    .snm span{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px}
    .caret{color:var(--ink-3);flex:none;transition:transform .18s}
    .sec.open .caret{transform:rotate(90deg)}

    .topics{border-top:1px solid var(--line);padding:2px 14px 10px}
    .tp{display:flex;align-items:center;gap:11px;min-height:44px;border-bottom:1px solid #F1F3EF}
    .tp:last-of-type{border-bottom:0}
    .box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--ink-3);flex:none;position:relative}
    .box.chk{background:var(--green);border-color:var(--green)}
    .box.chk svg{position:absolute;left:2px;top:2px;color:#fff}
    .tp b{flex:1;font-size:12.5px;font-weight:400;line-height:1.3}
    .tp b.done{color:var(--ink-3);text-decoration:line-through}
    .wt{width:34px;height:4px;border-radius:2px;background:var(--line);flex:none;overflow:hidden}
    .wt i{display:block;height:100%;background:var(--ink-3);opacity:.45}
    .tp em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink-3);width:26px;text-align:right;flex:none}
    .addrow{width:100%;min-height:44px;background:none;border:1px dashed var(--line);border-radius:10px;margin-top:9px;font-family:inherit;font-size:12px;color:var(--ink-3);cursor:pointer}

    .nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 0}
    .navi{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--ink-3);font-family:inherit;padding-top:6px}
    .navi.on{color:var(--ink)}
    .navi span{font-size:10px}
    .navi.on span{font-weight:600}
    .navpill{width:28px;height:3px;border-radius:2px;background:transparent;margin-top:2px}
    .navi.on .navpill{background:var(--ink)}
    .gesture{height:24px;flex:none;background:var(--card)}
  </style>
</helmet>

<div class="screen">
  <div class="hero">
    <div class="safe"></div>
    <div class="hrow">
      <h1>Syllabus</h1>
      <span class="n">69 / 634 hrs</span>
    </div>
    <div class="obar">
      <i style="width:11%;background:#5FCF9B"></i>
    </div>
    <div class="okeys">
      <div><i style="background:#5FCF9B"></i>69 hrs done</div>
      <div><i style="background:rgba(255,255,255,.22)"></i>565 hrs left</div>
    </div>
  </div>

  <div class="scroll">
    <div class="sec open">
      <button class="sechead">
        <span class="ring" style="background:conic-gradient(var(--green) 0 21%, var(--line) 0)"><span class="in">21%</span></span>
        <span class="snm"><b>Quantitative Aptitude</b><span>3 / 14 topics &middot; 216 hrs &middot; 25 Q</span></span>
        <span class="caret"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </button>
      <div class="topics">
        <div class="tp">
          <span class="box chk"><svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <b class="done">Number Systems</b><span class="wt"><i style="width:54%"></i></span><em>14h</em>
        </div>
        <div class="tp">
          <span class="box chk"><svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <b class="done">Percentage</b><span class="wt"><i style="width:38%"></i></span><em>10h</em>
        </div>
        <div class="tp">
          <span class="box chk"><svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <b class="done">Ratio &amp; Proportion</b><span class="wt"><i style="width:46%"></i></span><em>12h</em>
        </div>
        <div class="tp"><span class="box"></span><b>Averages</b><span class="wt"><i style="width:34%"></i></span><em>9h</em></div>
        <div class="tp"><span class="box"></span><b>Profit, Loss &amp; Discount</b><span class="wt"><i style="width:61%"></i></span><em>16h</em></div>
        <div class="tp"><span class="box"></span><b>Geometry</b><span class="wt"><i style="width:100%"></i></span><em>26h</em></div>
        <button class="addrow">+ Add a topic</button>
      </div>
    </div>

    <div class="sec">
      <button class="sechead">
        <span class="ring" style="background:conic-gradient(var(--green) 0 8%, var(--line) 0)"><span class="in">8%</span></span>
        <span class="snm"><b>General Intelligence &amp; Reasoning</b><span>1 / 13 topics &middot; 98 hrs &middot; 25 Q</span></span>
        <span class="caret"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </button>
    </div>

    <div class="sec">
      <button class="sechead">
        <span class="ring" style="background:conic-gradient(var(--green) 0 0%, var(--line) 0)"><span class="in">0%</span></span>
        <span class="snm"><b>General Awareness</b><span>0 / 10 topics &middot; 196 hrs &middot; 25 Q</span></span>
        <span class="caret"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </button>
    </div>

    <div class="sec">
      <button class="sechead">
        <span class="ring" style="background:conic-gradient(var(--green) 0 17%, var(--line) 0)"><span class="in">17%</span></span>
        <span class="snm"><b>English Comprehension</b><span>2 / 12 topics &middot; 124 hrs &middot; 25 Q</span></span>
        <span class="caret"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </button>
    </div>
    <div class="fade"></div>
  </div>

  <div class="nav">
    <button class="navi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 9.5h17M8 3v4M16 3v4"></path></svg>
      <span>Today</span><div class="navpill"></div>
    </button>
    <button class="navi on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"></path><circle cx="4.6" cy="6.5" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="4.6" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="4.6" cy="17.5" r="1.4" fill="currentColor" stroke="none"></circle></svg>
      <span>Syllabus</span><div class="navpill"></div>
    </button>
    <button class="navi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.8"></circle><path d="M12 13.5V9M9.5 2.6h5"></path></svg>
      <span>Focus</span><div class="navpill"></div>
    </button>
    <button class="navi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.7"></circle><path d="M4.8 20.6c1-3.9 3.8-5.9 7.2-5.9s6.2 2 7.2 5.9"></path></svg>
      <span>You</span><div class="navpill"></div>
    </button>
  </div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
