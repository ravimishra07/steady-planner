<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .sam-ios .content h1{margin-bottom:var(--sam-space-sm)}
    .sam-ios .lede{font-size:var(--sam-fs-md);color:var(--sam-text-secondary);line-height:var(--sam-lh-relaxed);margin-bottom:var(--sam-space-lg)}
    .sam-ios .slip{background:var(--sam-surface);border:var(--sam-card-border);border-radius:var(--sam-r-md);padding:2px 18px;box-shadow:var(--sam-card-shadow)}
    .sam-ios .slip .r{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--sam-hairline)}
    .sam-ios .slip .r:last-child{border-bottom:0}
    .sam-ios .slip .r b{flex:1;font-size:var(--sam-fs-callout);font-weight:500}
    .sam-ios .slip .r em{font-style:normal;font-size:var(--sam-fs-sub);color:var(--sam-text-muted);font-variant-numeric:tabular-nums}
    .sam-ios .slip .tot{border-top:1px solid var(--sam-border)}
    .sam-ios .slip .tot b{font-size:var(--sam-fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted)}
    .sam-ios .slip .tot em{font-size:var(--sam-fs-headline);font-weight:700;color:var(--sam-danger)}
    .sam-ios .sec{font-size:var(--sam-fs-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sam-text-muted);margin:var(--sam-space-md) 0 var(--sam-space-sm)}
    .sam-ios .fixcard{min-height:64px}
    .sam-ios .fixcard.sel{border-color:var(--sam-brand-deep);box-shadow:inset 0 0 0 .5px var(--sam-brand-deep)}
    .sam-ios .fixcard .metric{color:var(--sam-brand-soft);font-weight:700}
    .sam-ios .list{gap:var(--sam-space-sm)}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="topbar">
    <button class="glass-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="nav-title">Rebalance</span>
  </div>
  <div class="content">
    <p class="eyebrow" style="color:var(--sam-danger)">4 days missed</p>
    <h1>Here is what slipped</h1>
    <p class="lede">Nothing is lost. It has to go somewhere, and you choose where.</p>

    <div class="slip">
      <div class="r"><b>Geometry &mdash; Circles</b><em>6 hrs</em></div>
      <div class="r"><b>Mensuration &mdash; Solids</b><em>7 hrs</em></div>
      <div class="r"><b>Revision: Ratio &amp; Proportion</b><em>2 hrs</em></div>
      <div class="r"><b>Current Affairs &times; 4</b><em>2 hrs</em></div>
      <div class="r tot"><b>Total slipped</b><em>17 hrs</em></div>
    </div>

    <p class="sec">Pick one</p>
    <div class="list">
      <button class="fixcard sel">
        <span class="metric">+9m</span>
        <span class="ftxt"><b>Spread across every day</b><span>Nothing gets dropped</span></span>
        <span class="chev">&#8250;</span>
      </button>
      <button class="fixcard">
        <span class="metric">&minus;2</span>
        <span class="ftxt"><b>Drop Solids + one revision</b><span>Costs about 1.5 marks</span></span>
        <span class="chev">&#8250;</span>
      </button>
      <button class="fixcard">
        <span class="metric">3d</span>
        <span class="ftxt"><b>Push the target date</b><span>Keeps everything</span></span>
        <span class="chev">&#8250;</span>
      </button>
    </div>
  </div>
  <div class="foot"><button class="cta">Apply this change</button></div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
