<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <link rel="stylesheet" href="sam-shared.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .big{font-size:var(--sam-fs-mega);font-weight:var(--sam-fw-bold);letter-spacing:-.04em;color:var(--sam-danger);margin:8px 0 4px}
    .fixcard{min-height:64px}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="onboard-body" style="padding-top:4px">
    <div class="backrow">
      <button class="glass-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <span class="nav-title">Rebalance</span>
    </div>
    <p class="eyebrow">Since last week</p>
    <div class="big">+18 hrs</div>
    <p class="sub">You fell further behind. Pick how to recover.</p>
    <div class="list" style="margin-top:var(--sam-space-lg)">
      <button class="fixcard"><span class="metric">+1.5h</span><span class="ftxt"><b>Add to weekdays</b><span>5.5 hrs/day for next 30 days</span></span><span class="chev">&#8250;</span></button>
      <button class="fixcard"><span class="metric">&minus;6</span><span class="ftxt"><b>Skip 6 low-yield topics</b><span>Saves ~22 hrs</span></span><span class="chev">&#8250;</span></button>
      <button class="fixcard"><span class="metric">Sat</span><span class="ftxt"><b>Use Saturday catch-up</b><span>+4 hrs this weekend only</span></span><span class="chev">&#8250;</span></button>
    </div>
  </div>
  <div class="foot"><button class="cta">Apply changes</button></div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
