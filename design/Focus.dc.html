<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <script src="sam-theme.js"></script>
  <link rel="stylesheet" href="sam-tokens.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    .top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 var(--sam-screen-h);min-height:44px}
    .lbl{font-size:var(--sam-fs-xs);font-weight:var(--sam-fw-semibold);letter-spacing:.1em;text-transform:uppercase;color:var(--sam-text-muted)}
    .dial{flex:none;display:flex;align-items:center;justify-content:center;margin:var(--sam-space-xxl) 0;position:relative}
    .dial svg{display:block;transform:rotate(-90deg)}
    .dialtxt{position:absolute;text-align:center}
    .clock{font-size:var(--sam-fs-display);font-weight:var(--sam-fw-bold);letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
    .of{font-size:var(--sam-fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--sam-text-muted);margin-top:6px}
    .task{margin:0 var(--sam-screen-h);padding:15px;background:var(--sam-surface);border:var(--sam-card-border);border-radius:var(--sam-r-md);box-shadow:var(--sam-card-shadow)}
    .task .tag{display:inline-block;font-size:var(--sam-fs-xs);font-weight:var(--sam-fw-semibold);letter-spacing:.06em;text-transform:uppercase;background:var(--sam-success-container);color:var(--sam-success);padding:4px 7px;border-radius:var(--sam-r-sm);margin-bottom:var(--sam-space-sm)}
    .task b{display:block;font-size:var(--sam-fs-lg);font-weight:var(--sam-fw-semibold);margin-bottom:4px}
    .task p{font-size:var(--sam-fs-sub);color:var(--sam-text-muted);line-height:var(--sam-lh-normal)}
    .spacer{flex:1}
    .acts{flex:none;padding:0 var(--sam-screen-h) var(--sam-space-md);display:flex;gap:10px}
    .stop{flex:1;min-height:52px;background:transparent;border:1px solid var(--sam-hairline);color:var(--sam-text);border-radius:var(--sam-r-pill);font:inherit;font-size:var(--sam-fs-callout);font-weight:var(--sam-fw-semibold);cursor:pointer}
    .pause{width:52px;height:52px;background:var(--sam-brand-deep);color:var(--sam-on-brand);border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  </style>
</helmet>
<div class="screen sam-ios">
  <div class="safe"></div>
  <div class="top"><span class="lbl">Focus</span><button class="glass-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
  <div class="dial">
    <svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--sam-elevated)" stroke-width="10"/><circle cx="110" cy="110" r="96" fill="none" stroke="var(--sam-success)" stroke-width="10" stroke-dasharray="603" stroke-dashoffset="150" stroke-linecap="round"/></svg>
    <div class="dialtxt"><div class="clock">42:18</div><div class="of">of 75 min</div></div>
  </div>
  <div class="task"><span class="tag">Practice</span><b>Geometry &mdash; 40 questions</b><p>Previous-year set &middot; block everything else until done</p></div>
  <div class="spacer"></div>
  <div class="acts"><button class="stop">End session</button><button class="pause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg></button></div>
  <div class="gesture"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>class Component extends DCLogic { renderVals(){return{}} }</script>
</body>
</html>
